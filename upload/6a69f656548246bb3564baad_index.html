    // ========== 举报处理弹窗 ==========
    function openReportManager() {
      if (!isAdmin()) return;
      const reports = App.Storage.getReports();
      const content = document.getElementById('reportManagerContent');
      content.innerHTML = `<h2>📋 举报处理</h2><p style="color:var(--text-secondary);margin-bottom:16px;font-size:.82rem">共 ${reports.filter(r=>r.status==='pending').length} 条待处理</p><div id="reportListContainer"></div>`;
      renderReportList(reports);
      document.getElementById('reportManagerModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function closeReportManager() { document.getElementById('reportManagerModal').classList.add('hidden'); document.body.style.overflow = ''; }

    function renderReportList(reports) {
      const container = document.getElementById('reportListContainer');
      if (!container) return;
      const pending = reports.filter(r => r.status === 'pending');
      if (pending.length === 0) { container.innerHTML = '<p style="text-align:center;color:var(--text-tertiary)">暂无待处理举报</p>'; return; }
      container.innerHTML = pending.map((r, idx) => {
        const mapName = App.state.maps.find(m => m.id === r.mapId)?.name || '未知';
        const agentName = App.state.agents.find(a => a.id === r.agentId)?.name || '未知';
        const sideName = r.side === 'attack' ? '进攻方' : '防守方';
        let reasonText = '';
        if (r.reason === 'inaccurate') reasonText = '点位描述错误或不准确，无法使用';
        else if (r.reason === 'violation') reasonText = '文字或图片含有违规内容';
        else if (r.reason === 'other') reasonText = '其他：' + (r.details || '未说明');
        return `<div class="list-item" style="flex-direction:column;align-items:flex-start;gap:8px">
          <div><strong>点位：</strong>${r.spotName} (${mapName} · ${agentName} · ${sideName})</div>
          <div><strong>举报人：</strong>${r.reporterNick} (ID: ${r.reporterId})</div>
          <div><strong>原因：</strong>${reasonText}</div>
          <div><strong>时间：</strong>${App.formatDate(r.createdAt)}</div>
          <div style="display:flex;gap:8px;margin-top:6px">
            <button class="btn-small btn-primary view-report-btn" data-idx="${idx}">查看</button>
            <button class="btn-small btn-primary confirm-report-btn" data-idx="${idx}">确认无误</button>
            <button class="btn-small btn-primary edit-report-btn" data-idx="${idx}">编辑点位</button>
            <button class="btn-small btn-danger delete-report-btn" data-idx="${idx}">删除点位</button>
          </div>
        </div>`;
      }).join('');

      container.querySelectorAll('.view-report-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const report = pending[parseInt(btn.dataset.idx)];
          const spot = App.state.spots.find(s => s.id === report.spotId);
          if (spot) {
            App.setState({ selectedSpot: spot, editingSpot: null, currentStep: 4 });
            closeReportManager();
            renderView();
          } else alert('该点位已被删除');
        });
      });
      container.querySelectorAll('.confirm-report-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const report = pending[parseInt(btn.dataset.idx)];
          if (await App.showConfirm('确认该举报内容无误？举报将被标记为已解决。')) {
            const allReports = App.Storage.getReports();
            const found = allReports.find(r => r.id === report.id);
            if (found) { found.status = 'resolved'; found.resolvedBy = App.state.currentUser.id; found.resolvedAt = new Date().toISOString(); found.result = 'confirmed'; }
            App.Storage.saveReports(allReports);
            renderReportList(allReports);
          }
        });
      });
      container.querySelectorAll('.edit-report-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const report = pending[parseInt(btn.dataset.idx)];
          const spot = App.state.spots.find(s => s.id === report.spotId);
          if (spot) {
            closeReportManager();
            saveSpotVersion(spot);
            App.setState({ selectedSpot: spot, editingSpot: { ...spot }, currentStep: 4 });
            renderView();
          } else alert('该点位已被删除，无法编辑');
        });
      });
      container.querySelectorAll('.delete-report-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const report = pending[parseInt(btn.dataset.idx)];
          if (await App.showConfirm('确定删除该点位吗？它将移入回收站。')) {
            softDeleteSpot(report.spotId);
            const allReports = App.Storage.getReports();
            const found = allReports.find(r => r.id === report.id);
            if (found) { found.status = 'resolved'; found.resolvedBy = App.state.currentUser.id; found.resolvedAt = new Date().toISOString(); found.result = 'deleted'; }
            App.Storage.saveReports(allReports);
            renderReportList(allReports);
          }
        });
      });
    }

    function openReportModal(spotId) {
      if (!App.state.currentUser || App.state.currentUser.blocked) return alert('请先登录');
      const reports = App.Storage.getReports();
      const pendingReport = reports.find(r => r.spotId === spotId && r.status === 'pending');
      if (pendingReport) return alert('该点位已有待处理举报');
      const recentResolved = reports.find(r => r.spotId === spotId && r.status === 'resolved' && (Date.now() - new Date(r.resolvedAt).getTime() < 3 * 86400000));
      if (recentResolved) return alert('该点位最近3天内已处理，暂时无法重复举报');
      const spot = App.state.spots.find(s => s.id === spotId);
      if (!spot) return;
      const content = document.getElementById('reportContent');
      content.innerHTML = `<h2>举报点位</h2><h3 style="margin-bottom:12px">${spot.name}</h3>
        <div class="form-group"><label>举报原因</label><select id="reportReason"><option value="inaccurate">点位描述错误或不准确，无法使用</option><option value="violation">文字或图片含有违规内容</option><option value="other">其他</option></select></div>
        <div class="form-group hidden" id="reportDetailsGroup"><label>详细说明</label><textarea id="reportDetails" rows="3" placeholder="请描述具体问题"></textarea></div>
        <button class="btn btn-primary" id="submitReportBtn">确认举报</button><button class="btn btn-outline" id="cancelReportBtn">取消</button>`;
      document.getElementById('reportReason').addEventListener('change', function() { document.getElementById('reportDetailsGroup').classList.toggle('hidden', this.value !== 'other'); });
      document.getElementById('submitReportBtn').addEventListener('click', () => {
        const reason = document.getElementById('reportReason').value;
        const details = reason === 'other' ? document.getElementById('reportDetails').value.trim() : '';
        if (reason === 'other' && !details) return alert('请填写详细说明');
        const reports = App.Storage.getReports();
        reports.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), spotId: spot.id, spotName: spot.name, mapId: spot.map, agentId: spot.agent, side: spot.side, reporterId: App.state.currentUser.id, reporterNick: App.state.currentUser.nickname, reason, details, createdAt: new Date().toISOString(), status: 'pending', resolvedBy: null, resolvedAt: null, result: null });
        App.Storage.saveReports(reports);
        document.getElementById('reportModal').classList.add('hidden');
        document.body.style.overflow = '';
        alert('举报已提交，感谢您的反馈！');
      });
      document.getElementById('cancelReportBtn').addEventListener('click', closeReportModal);
      document.getElementById('reportModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function closeReportModal() { document.getElementById('reportModal').classList.add('hidden'); document.body.style.overflow = ''; }

    // ========== 处理历史弹窗 ==========
    function openHistoryModal() {
      if (!isAdmin()) return;
      const reports = App.Storage.getReports().filter(r => r.status === 'resolved');
      const deleted = App.state.deletedSpots;
      const content = document.getElementById('historyContent');
      content.innerHTML = `<h2>📜 处理历史</h2><h3 style="margin-top:16px">已解决举报</h3><div id="historyReportsContainer">${renderHistoryReports(reports)}</div><h3 style="margin-top:24px">回收站 (${deleted.length}个点位)</h3><div id="historyDeletedContainer">${renderHistoryDeleted(deleted)}</div>`;
      document.getElementById('historyModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      bindHistoryEvents(reports, deleted);
    }
    function closeHistoryModal() { document.getElementById('historyModal').classList.add('hidden'); document.body.style.overflow = ''; }

    function renderHistoryReports(reports) {
      if (reports.length === 0) return '<p style="text-align:center;color:var(--text-tertiary)">暂无已解决举报</p>';
      return reports.map(r => {
        const resolver = App.getUserById(r.resolvedBy);
        const resolverName = resolver ? resolver.nickname : '未知';
        let reasonText = '';
        if (r.reason === 'inaccurate') reasonText = '点位描述错误或不准确，无法使用';
        else if (r.reason === 'violation') reasonText = '文字或图片含有违规内容';
        else if (r.reason === 'other') reasonText = '其他：' + (r.details || '未说明');
        return `<div class="list-item" style="flex-direction:column;align-items:flex-start;gap:6px">
          <div><strong>点位：</strong>${r.spotName}</div>
          <div><strong>处理人：</strong>${resolverName} | <strong>结果：</strong>${r.result === 'confirmed' ? '确认无误' : '已删除'}</div>
          <div><strong>处理时间：</strong>${App.formatDate(r.resolvedAt)}</div>
          <button class="btn-small btn-danger delete-history-report" data-report-id="${r.id}">删除记录</button>
        </div>`;
      }).join('');
    }

    function renderHistoryDeleted(deleted) {
      if (deleted.length === 0) return '<p style="text-align:center;color:var(--text-tertiary)">回收站为空</p>';
      return deleted.map(spot => {
        const mapName = App.state.maps.find(m => m.id === spot.map)?.name || '未知';
        const agentName = App.state.agents.find(a => a.id === spot.agent)?.name || '未知';
        const sideName = spot.side === 'attack' ? '进攻方' : '防守方';
        return `<div class="list-item" style="flex-direction:column;align-items:flex-start;gap:6px">
          <div><strong>${spot.name}</strong> (${mapName} · ${agentName} · ${sideName})</div>
          <div><strong>删除时间：</strong>${App.formatDate(spot.deletedAt)}</div>
          <div style="display:flex;gap:8px">
            <button class="btn-small btn-primary restore-spot-btn" data-spot-id="${spot.id}">恢复点位</button>
            <button class="btn-small btn-danger permanent-delete-btn" data-spot-id="${spot.id}">彻底删除</button>
          </div>
        </div>`;
      }).join('');
    }

    function bindHistoryEvents(reports, deleted) {
      document.querySelectorAll('.restore-spot-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          restoreSpot(btn.dataset.spotId);
          closeHistoryModal();
          alert('点位已恢复');
          renderView();
        });
      });
      document.querySelectorAll('.delete-history-report').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (await App.showConfirm('确定删除这条举报记录吗？')) {
            let allReports = App.Storage.getReports();
            allReports = allReports.filter(r => r.id !== btn.dataset.reportId);
            App.Storage.saveReports(allReports);
            openHistoryModal();
          }
        });
      });
      document.querySelectorAll('.permanent-delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (await App.showConfirm('确定彻底删除该点位吗？所有图片将被永久移除，此操作不可恢复。')) {
            await permanentlyDeleteSpot(btn.dataset.spotId);
            closeHistoryModal();
            alert('点位已彻底删除');
            renderView();
          }
        });
      });
    }

    // ========== 数据统计仪表盘 ==========
    function openStatsModal() {
      if (!isAdmin()) return;
      const users = App.Storage.getUsers();
      const spots = App.state.spots;
      const reports = App.Storage.getReports();
      const resolvedReports = reports.filter(r => r.status === 'resolved');
      const pendingReports = reports.filter(r => r.status === 'pending');
      document.getElementById('statsContent').innerHTML = `<h2>📊 数据统计</h2>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value">${users.length}</div><div class="stat-label">总用户数</div></div>
          <div class="stat-card"><div class="stat-value">${spots.length}</div><div class="stat-label">总点位数</div></div>
          <div class="stat-card"><div class="stat-value">${pendingReports.length}</div><div class="stat-label">待处理举报</div></div>
          <div class="stat-card"><div class="stat-value">${resolvedReports.length}</div><div class="stat-label">已解决举报</div></div>
        </div>
        <h3>举报趋势（近7天）</h3><canvas id="reportChart" width="400" height="200"></canvas>
        <h3 style="margin-top:20px">点位分布</h3><canvas id="spotChart" width="400" height="200"></canvas>
        <button class="btn btn-outline" id="closeStatsBtn" style="margin-top:20px">关闭</button>`;
      document.getElementById('statsModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      document.getElementById('closeStatsBtn').addEventListener('click', closeStatsModal);

      const days = [], counts = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(Date.now() - i * 86400000);
        days.push(`${d.getMonth()+1}/${d.getDate()}`);
        const dateStr = d.toISOString().slice(0,10);
        counts.push(reports.filter(r => r.createdAt.slice(0,10) === dateStr).length);
      }
      new Chart(document.getElementById('reportChart'), { type: 'line', data: { labels: days, datasets: [{ label: '举报数', data: counts, borderColor: '#FF4655', tension: 0.3 }] }, options: { scales: { y: { beginAtZero: true } } } });

      const mapNames = App.state.maps.map(m => m.name);
      const mapCounts = App.state.maps.map(m => spots.filter(s => s.map === m.id).length);
      new Chart(document.getElementById('spotChart'), { type: 'bar', data: { labels: mapNames, datasets: [{ label: '点位数', data: mapCounts, backgroundColor: '#FF4655' }] }, options: { scales: { y: { beginAtZero: true } } } });
    }
    function closeStatsModal() { document.getElementById('statsModal').classList.add('hidden'); document.body.style.overflow = ''; }

    // ========== 导出/导入 ==========
    async function exportData() {
      if (!isAdmin()) return;
      const json = await App.Storage.exportAll();
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `kudian_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
      URL.revokeObjectURL(url);
    }
    function importData() {
      if (!isAdmin()) return;
      const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const text = await file.text();
        if (await App.showConfirm('导入数据将覆盖现有数据，确定继续？')) {
          await App.Storage.importAll(text);
          alert('导入成功，页面即将刷新');
          location.reload();
        }
      };
      input.click();
    }

    // ========== 全局事件 ==========
    window.closeManager = function() { document.getElementById('managerModal').classList.add('hidden'); document.body.style.overflow=''; renderView(); };
    window.closeAuth = closeAuth;
    window.closeUserManager = closeUserManager;
    window.closeReportManager = closeReportManager;
    window.closeReportModal = closeReportModal;
    window.closeHistoryModal = closeHistoryModal;
    window.closeNicknameModal = closeNicknameModal;
    window.closeAnnounceList = function() { document.getElementById('announceListModal').classList.add('hidden'); document.body.style.overflow=''; updateAnnounceDot(); };
    window.closeAnnounceView = function() { document.getElementById('announceViewModal').classList.add('hidden'); document.body.style.overflow=''; updateAnnounceDot(); };
    window.closeAnnounceManage = function() { document.getElementById('announceManageModal').classList.add('hidden'); document.body.style.overflow=''; };
    window.closeStatsModal = closeStatsModal;

    stepIndicator.addEventListener('click', e => {
      const dot = e.target.closest('.step-dot');
      if (!dot) return;
      const step = parseInt(dot.dataset.step);
      if (step < App.state.currentStep) {
        App.setState({ currentStep: step, selectedAgent: step<1?null:App.state.selectedAgent, selectedSide: step<2?null:App.state.selectedSide, selectedSpot: step<3?null:App.state.selectedSpot });
        renderView();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        ['managerModal','authModal','userManagerModal','reportManagerModal','reportModal','historyModal','nicknameModal','announceListModal','announceViewModal','announceManageModal','statsModal'].forEach(id => {
          const el = document.getElementById(id);
          if (el && !el.classList.contains('hidden')) el.classList.add('hidden');
        });
        document.body.style.overflow = '';
      }
    });

    document.getElementById('announceBtn').addEventListener('click', () => {
      const announcements = App.Storage.getAnnouncements();
      if (announcements.length === 0) { alert('暂无公告'); return; }
      const content = document.getElementById('announceListContent');
      content.innerHTML = `<h2>📢 公告</h2>` + announcements.slice().reverse().map(a => {
        return `<div class="announce-card" data-id="${a.id}"><span class="announce-card-title">${a.title}</span><span class="announce-card-time">${App.formatDate(a.createdAt)}</span></div>`;
      }).join('');
      document.getElementById('announceListModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      document.querySelectorAll('.announce-card').forEach(item => {
        item.addEventListener('click', () => {
          const id = item.dataset.id;
          document.getElementById('announceListModal').classList.add('hidden');
          openAnnounceView(id);
        });
      });
      const readMap = App.Storage.getAnnounceReadMap();
      readMap[App.state.currentUser?.id] = announcements.map(a => a.id);
      App.Storage.saveAnnounceReadMap(readMap);
      updateAnnounceDot();
    });

    document.querySelectorAll('.leaderboard-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.leaderboard-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        App.state.leaderboardTab = tab.dataset.tab;
        updateLeaderboard();
      });
    });

    document.getElementById('manageBtn').addEventListener('click', e => {
      e.stopPropagation();
      document.getElementById('manageMenu').classList.toggle('hidden');
      const userPanel = document.querySelector('.user-panel');
      if (userPanel) userPanel.classList.add('hidden');
    });
    document.addEventListener('click', e => {
      const d = document.getElementById('manageDropdown');
      if (d && !d.classList.contains('hidden')) {
        const m = document.getElementById('manageMenu');
        if (m && !m.classList.contains('hidden') && !d.contains(e.target)) m.classList.add('hidden');
      }
    });

    // ========== 启动 ==========
    (async function() {// ========== 启动前自动修复 votes 数据格式 ==========
  (function repairVotes() {
  const votes = App.Storage.getVotes();
  let needsSave = false;
  for (const spotId in votes) {
    const sv = votes[spotId];
    if (!sv || typeof sv !== 'object') {
      votes[spotId] = { likes: {}, dislikes: {} };
      needsSave = true;
      continue;
    }
    if (!sv.likes || typeof sv.likes !== 'object' || Array.isArray(sv.likes)) {
      sv.likes = {};
      needsSave = true;
    }
    if (!sv.dislikes || typeof sv.dislikes !== 'object' || Array.isArray(sv.dislikes)) {
      sv.dislikes = {};
      needsSave = true;
    }
  }
  if (needsSave) App.Storage.saveVotes(votes);
  })();
      await App.DB.open();
      await ensureSuperAdmin();
      updateUserUI();
      updateLeaderboard();
      updateAnnounceDot();
      renderView();
    })();
  </script>
</body>
</html>
